function bsCI(arr,nr=2000){if(!arr||arr.length<2)return null;const n=arr.length,mu=arr.reduce((a,b)=>a+b,0)/n;const boot=Array.from({length:nr},()=>{let s=0;for(let i=0;i<n;i++)s+=arr[Math.floor(Math.random()*n)];return s/n;}).sort((a,b)=>a-b);return{mean:mu,lower:boot[Math.floor(nr*0.025)],upper:boot[Math.floor(nr*0.975)],n};}
function confOf(n){if(n===0)return{bg:C.faint,fg:C.muted,badge:"NOT RUN"};if(n<=2)return{bg:C.roseDim,fg:C.rose,badge:"FALSE PRECISION"};if(n<=6)return{bg:C.amberDim,fg:C.amber,badge:"MED CONFIDENCE"};if(n<=9)return{bg:C.greenDim,fg:C.green,badge:"HIGH CONFIDENCE"};return{bg:"#162918",fg:C.green,badge:"SCHULTE N>=10"};}

function Sparkline({data,color,w=64,h=24}){
  const v=data.filter(x=>x!=null);
  if(v.length<2)return <span style={{fontFamily:"'JetBrains Mono',monospace",fontSize:"11px",color:color||C.muted}}>{v[0]!=null?Number(v[0]).toFixed(1):"---"}</span>;
  const min=Math.min(...v),max=Math.max(...v),rng=max-min||0.001;
  let xi=0;
  const pts=data.map((val)=>{if(val==null)return null;const x=(xi++/(v.length-1))*w,y=h-((val-min)/rng)*h;return x.toFixed(1)+","+y.toFixed(1);}).filter(Boolean).join(" ");
  const last=v[v.length-1],prev=v[v.length-2];
  const dir=last>prev+0.05?"up":last<prev-0.05?"dn":"---";
  const dc=last>prev+0.05?C.green:last<prev-0.05?C.rose:C.muted;
  const lastPt=pts.split(" ").at(-1)?.split(",");
  return(
    <div style={{display:"flex",alignItems:"center",gap:"5px"}}>
      <svg width={w} height={h}><polyline points={pts} fill="none" stroke={color} strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round"/>{lastPt&&<circle cx={lastPt[0]} cy={lastPt[1]} r="2.5" fill={color}/>}</svg>
      <span style={{color:dc,fontSize:"11px",fontWeight:700}}>{dir==="up"?"↑":dir==="dn"?"↓":"→"}</span>
      <span style={{fontFamily:"'JetBrains Mono',monospace",fontSize:"11px",color}}>{Number(last).toFixed(1)}</span>
    </div>
  );
}

  const cited2=PROMPTS.filter(p=>p.status!=="slate").length;
  const first2=PROMPTS.filter(p=>p.pos===1).length;
  const sarr=PROMPTS.filter(p=>p.s!=null).map(p=>p.s);
  const avgS=(sarr.reduce((a,b)=>a+b,0)/sarr.length).toFixed(1);
  const ms=useMemo(()=>{let t=all.length,f=0,m=0,h=0,s=0;PROMPTS.forEach(p=>ENGINES.forEach(e=>{const n=gn(p.id,e.id);if(n===1||n===2)f++;else if(n<=6)m++;else if(n<=9)h++;else if(n>=10)s++;}));return{t,f,m,h,s};},[runs.length]);

  const TABS=[{id:"overview",l:"Overview"},{id:"sov",l:"Share of Voice"},{id:"measure",l:"Measurement"},{id:"audit",l:"Site Audit"},{id:"engines",l:"Engines"},{id:"inputs",l:"Input Tracker"},{id:"prompts",l:"Prompts"},{id:"guide",l:"Guide"}];

  const Chip=({c,ch})=><span style={{background:c+"18",color:c,border:"1px solid "+c+"28",fontSize:"9px",fontWeight:700,letterSpacing:"0.1em",padding:"2px 6px",borderRadius:"3px",fontFamily:"'JetBrains Mono',monospace",whiteSpace:"nowrap"}}>{ch}</span>;

                <Card key={i} style={{borderTop:"2px solid "+C.accent+"22"}}>

            <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:"14px"}}>
              <Callout color={C.rose} icon="📊" title="Shadow Reputation: 85% of AI citations = earned media — pitch the right outlets">

                Cited 64% of prompts. Actively <strong style={{color:C.text}}>recommended: 21%</strong>. The gap is the recommendation problem. Narrative patterns in Heatmap hover show where "popular app with privacy history" blocks recommendation.
              </Callout>
            </div>
            <Card>
              <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:"14px"}}>
                <Lbl>Sweep History - {sweeps.length} sweep{sweeps.length!==1?"s":""} - ChatGPT</Lbl>

              </div>
              {sweeps.map((sw,i)=>(

                  <span style={{fontFamily:"'JetBrains Mono',monospace",fontSize:"11px",color:C.text}}>{sw.date}</span>
                  <span style={{fontFamily:"'JetBrains Mono',monospace",fontSize:"11px",color:C.muted}}>{sw.n}</span>

      {tab==="inputs"&&(
        <div style={{display:"flex",flexDirection:"column",gap:"16px"}}>
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:"12px"}}>
            {[{l:"Tier 1 - Zero Engineering",done:t1done.size,total:T1.length,c:C.accent},{l:"Tier 2 - Editorial Sprint",done:t2done.size,total:T2.length,c:C.lav}].map((t,i)=>(
              <Card key={i}><div style={{display:"flex",justifyContent:"space-between",marginBottom:"10px"}}><span style={{fontSize:"12px",color:C.muted}}>{t.l}</span><span style={{fontFamily:"'JetBrains Mono',monospace",fontSize:"13px",color:t.c}}>{t.done+"/"+t.total}</span></div><div style={{height:"4px",background:C.border,borderRadius:"2px",overflow:"hidden"}}><div style={{height:"100%",width:((t.done/t.total)*100)+"%",background:t.c,borderRadius:"2px",transition:"width 0.3s"}}/></div><div style={{fontSize:"10px",color:C.muted,marginTop:"6px",fontStyle:"italic"}}>{t.done>0?"Progress saved":"Tick items to track progress"}</div></Card>

            <Card><div style={{display:"flex",alignItems:"center",gap:"8px",marginBottom:"14px"}}><Chip c={C.accent} ch="TIER 1"/><span style={{fontSize:"13px",fontWeight:600,color:C.text}}>Zero Engineering</span></div><div style={{display:"flex",flexDirection:"column",gap:"4px"}}>{T1.map((item,i)=><CRow key={i} item={item} done={t1done.has(i)} onClick={()=>tog(setT1done,i)}/>)}</div></Card>
            <Card><div style={{display:"flex",alignItems:"center",gap:"8px",marginBottom:"14px"}}><Chip c={C.lav} ch="TIER 2"/><span style={{fontSize:"13px",fontWeight:600,color:C.text}}>Editorial Sprint</span></div><div style={{display:"flex",flexDirection:"column",gap:"4px"}}>{T2.map((item,i)=><CRow key={i} item={item} done={t2done.has(i)} onClick={()=>tog(setT2done,i)}/>)}</div></Card>

      {tab==="prompts"&&(
        <div style={{display:"flex",flexDirection:"column",gap:"16px"}}>
          <Callout color={C.amber} icon="warning" title="N=1 - Rec% is computed from logged runs. Log more runs in Measurement to improve accuracy.">
            Rec% = percentage of cited runs where Flo was actively recommended. Currently based on single baseline run.
          </Callout>
          <Card>
            <div style={{overflowX:"auto"}}>
              <table style={{width:"100%",borderCollapse:"collapse",fontSize:"12px"}}>
                <thead><tr style={{borderBottom:"1px solid "+C.border}}>{["ID","Arch","Prompt","Status","Pos","Sent","Men","URL","Click","Rec%","Dir","Drift","Vol"].map(h=><th key={h} style={{padding:"7px 8px",textAlign:"left",color:C.muted,fontWeight:500,fontSize:"10px",letterSpacing:"0.07em",textTransform:"uppercase",whiteSpace:"nowrap"}}>{h}</th>)}</tr></thead>
                <tbody>
                  {PROMPTS.map((p,i)=>{
                    const s=SM[p.status];const v=p.vol?VM[p.vol]:null;const rr=getRecRate(p.id,"chatgpt");

                      <tr key={i} style={{borderBottom:"1px solid "+C.border+"20"}}>
                        <td style={{padding:"8px",fontFamily:"'JetBrains Mono',monospace",fontSize:"11px",color:s.color}}>{p.id}</td>
                        <td style={{padding:"8px",color:C.muted,fontSize:"10px"}}>{p.arch}</td>
                        <td style={{padding:"8px",color:C.text,maxWidth:"175px",fontSize:"11px"}}>{p.label}</td>
                        <td style={{padding:"8px"}}><span style={{background:s.dim,color:s.color,border:"1px solid "+s.color+"30",fontSize:"9px",padding:"2px 6px",borderRadius:"3px",fontWeight:600,whiteSpace:"nowrap"}}>{s.label}</span></td>
                        <td style={{padding:"8px",color:C.muted,fontFamily:"'JetBrains Mono',monospace",fontSize:"11px"}}>{p.pos!=null?"#"+p.pos:"---"}</td>
                        <td style={{padding:"8px",color:p.s!=null?C.text:C.faint,fontFamily:"'JetBrains Mono',monospace",fontSize:"11px"}}>{p.s!=null?p.s:"---"}</td>
                        {["m","u","c"].map(k=><td key={k} style={{padding:"8px"}}><div style={{width:"8px",height:"8px",borderRadius:"50%",background:p.depth[k]?C.accent:C.faint,border:"1px solid "+(p.depth[k]?C.accent:C.borderB)}}/></td>)}
                        <td style={{padding:"8px",fontFamily:"'JetBrains Mono',monospace",fontSize:"11px",color:rr!=null?C.amber:C.faint}}>{rr!=null?rr+"%":"---"}</td>
                        <td style={{padding:"8px"}}>{v?<span style={{background:v.color+"18",color:v.color,border:"1px solid "+v.color+"28",fontSize:"9px",padding:"2px 5px",borderRadius:"3px",fontWeight:600,whiteSpace:"nowrap"}}>{v.label}</span>:<span style={{color:C.faint,fontSize:"10px"}}>---</span>}</td>
                      </tr>

                  })}
                </tbody>
              </table>
            </div>
          </Card>
        </div>
      )}

      {tab==="guide"&&(
        <div style={{display:"flex",flexDirection:"column",gap:"14px"}}>

            <Lbl>30-Day Plan - No budget. No engineering. Content, schema, URL architecture only.</Lbl>
            {[
              {n:"01",t:"Privacy chronology + schema + entity consistency",d:"Days 1-14",c:C.rose,b:"5+ prompts affected. 85% of AI citations = earned media, negative earned coverage is the drag mechanism.",f:"Privacy FAQ chronology + FAQPage JSON-LD + Organization JSON-LD + standardise brand name across App Store/Play Store/schema.",w:"FAQPage = 2.7x lift. Organization = entity disambiguation. Entity consistency fixes 4 inconsistencies that fragment AI brand understanding."},
              {n:"02",t:"Specialty hub pages + AI-cited PR targets",d:"Days 15-30",c:C.accent,b:"0% SoV on 5 vertical prompts. PR is targeting the wrong journalists - Healthline and SELF are AI-cited but not pitched.",f:"5 hub pages + 2 comparison cornerstones. Pitch Mayo Clinic study to Healthline and SELF specifically.",w:"PR gap: "+PR_OV+"% overlap with AI-cited outlets. Healthline is cited for PCOS + pregnancy prompts. One placement starts the citation chain."},
              {n:"03",t:"Claude + Perplexity baselines + earned media audit",d:"Month 2",c:C.lav,b:"Claude unbaselined despite #2 referral status. Monthly earned media monitor needed.",f:"Claude baseline (all 14 prompts, N=3). Monthly audit: which outlets AI cites for period tracker, PCOS app, perimenopause app.",w:"11% citation overlap: each engine needs its own baseline. The PR gap compounds across engines."},
            ].map((s,i)=>(
              <div key={i} style={{background:C.surfaceAlt,borderRadius:"9px",padding:"18px",borderLeft:"2px solid "+s.c,marginBottom:"10px"}}>
                <div style={{display:"flex",justifyContent:"space-between",marginBottom:"8px"}}>
                  <div style={{display:"flex",alignItems:"center",gap:"10px"}}><span style={{fontFamily:"'JetBrains Mono',monospace",fontSize:"12px",color:s.c}}>{s.n}</span><span style={{fontSize:"14px",fontWeight:600,color:C.text}}>{s.t}</span></div>
                  <Chip c={s.c} ch={s.d}/>
                </div>
                <div style={{fontSize:"12px",color:C.muted,marginBottom:"7px"}}>{s.b}</div>
                <div style={{fontSize:"12px",color:C.text,marginBottom:"5px"}}><strong style={{color:s.c}}>Fix: </strong>{s.f}</div>
                <div style={{fontSize:"12px",color:C.muted}}><strong style={{color:C.muted}}>Why: </strong>{s.w}</div>
              </div>
            ))}
          </Card>
          <Card>
            <Lbl>KPI Framework - Three Layers + Dark Demand</Lbl>

            {/* Layer 1 - Entity Health */}
            <div style={{background:C.lavDim,border:"1px solid "+C.lav+"30",borderRadius:"9px",padding:"14px 16px",marginBottom:"10px"}}>
              <div style={{fontSize:"11px",fontWeight:700,color:C.lav,letterSpacing:"0.08em",textTransform:"uppercase",marginBottom:"10px"}}>Layer 0 - Entity Health (Foundation)</div>
              <div style={{fontSize:"11px",color:C.muted,lineHeight:1.65,marginBottom:"10px"}}>
                <strong style={{color:C.text}}>Deaure principle:</strong> citations are a symptom of entity health, not a target to game. Fix entity coherence and citations follow. Get the entity wrong and no content strategy compensates.
              </div>
              <div style={{display:"grid",gridTemplateColumns:"repeat(3,1fr)",gap:"8px"}}>
                {[
                  {l:"Entity Consistency Score",v:"58%",t:"Target: 90%+",c:C.rose,note:"Brand name, MAU, category across App Store, Play Store, Wikipedia, schema, Wikidata"},
                  {l:"Organization sameAs graph",v:"Missing",t:"Add immediately",c:C.rose,note:"Central entity anchor — Wikidata, LinkedIn, Crunchbase, App Store"},
                  {l:"Cross-model consistency",v:"Not measured",t:"Baseline M1",c:C.amber,note:"Same entity representation across ChatGPT, Claude, Perplexity, Gemini"},
                ].map((k,i)=>(
                  <div key={i} style={{background:C.faint,borderRadius:"7px",padding:"10px 12px"}}>
                    <div style={{fontSize:"10px",color:C.muted,marginBottom:"4px",lineHeight:1.4}}>{k.l}</div>
                    <div style={{fontFamily:"'JetBrains Mono',monospace",fontSize:"16px",color:k.c,marginBottom:"3px"}}>{k.v}</div>
                    <div style={{fontSize:"10px",color:k.c,marginBottom:"4px"}}>{k.t}</div>
                    <div style={{fontSize:"10px",color:C.faint,lineHeight:1.4}}>{k.note}</div>
                  </div>
                ))}
              </div>
            </div>

            {/* Layer 1 - Shadow Reputation / Canary Queries */}
            <div style={{background:C.accentDim,border:"1px solid "+C.accent+"30",borderRadius:"9px",padding:"14px 16px",marginBottom:"10px"}}>
              <div style={{fontSize:"11px",fontWeight:700,color:C.accent,letterSpacing:"0.08em",textTransform:"uppercase",marginBottom:"10px"}}>Layer 1 - Shadow Reputation (Canary Queries)</div>
              <div style={{display:"grid",gridTemplateColumns:"repeat(2,1fr)",gap:"8px"}}>
                {[
                  {l:"Citation Rate (B->E prompts)",v:"64%",t:"Target: 85%",c:C.amber},
                  {l:"First-Named Rate",v:"21%",t:"Target: 45%",c:C.amber},
                  {l:"Avg Sentiment",v:"2.9/5",t:"Target: 3.5+",c:C.amber},
                  {l:"E->B Retrieval Rate (vertical prompts)",v:"0/5",t:"Target: 3/5",c:C.rose},
                  {l:"Negative Framing",v:"33%",t:"Target: <10%",c:C.rose},
                  {l:"Absence Count",v:"5/14",t:"Target: <2",c:C.rose},
                ].map((k,i)=>(
                  <div key={i} style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"7px 10px",background:C.faint,borderRadius:"6px"}}>
                    <span style={{fontSize:"11px",color:C.muted,flex:1}}>{k.l.replace("B->E","B→E").replace("E->B","E→B")}</span>
                    <div style={{textAlign:"right",flexShrink:0,marginLeft:"10px"}}>
                      <div style={{fontFamily:"'JetBrains Mono',monospace",fontSize:"12px",color:k.c,fontWeight:700}}>{k.v}</div>
                      <div style={{fontSize:"10px",color:C.faint}}>{k.t}</div>
                    </div>
                  </div>
                ))}
              </div>
            </div>

            {/* Layer 2 - Dark Demand */}
            <div style={{background:C.greenDim,border:"1px solid "+C.green+"30",borderRadius:"9px",padding:"14px 16px",marginBottom:"10px"}}>
              <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:"8px"}}>
                <div style={{fontSize:"11px",fontWeight:700,color:C.green,letterSpacing:"0.08em",textTransform:"uppercase"}}>Layer 2 - Dark Demand (Branded Search Proxy)</div>
                <span style={{fontSize:"9px",background:C.greenDim,color:C.green,border:"1px solid "+C.green+"30",padding:"2px 7px",borderRadius:"3px",fontFamily:"'JetBrains Mono',monospace"}}>Deaure 2026</span>
              </div>
              <div style={{fontSize:"11px",color:C.muted,lineHeight:1.65,marginBottom:"10px",padding:"8px 12px",background:C.faint,borderRadius:"7px",borderLeft:"2px solid "+C.green}}>
                <strong style={{color:C.text}}>The billboard effect:</strong> someone sees Flo in an AI answer, doesn{"'"}t click, searches "Flo app" directly 2 days later. Shows in GSC branded sessions with <strong style={{color:C.text}}>zero AI attribution in GA4.</strong> LLM referrals under 2% of total traffic — if clicks-from-citation is the KPI, you{"'"}re optimising a shrinking channel. Branded search velocity is the signal that captures what GA4 misses entirely.
              </div>
              <div style={{display:"grid",gridTemplateColumns:"repeat(3,1fr)",gap:"8px"}}>
                {[
                  {l:"Branded search sessions (GSC)",v:"Baseline M1",t:"Primary dark demand proxy",c:C.green,note:"Week-over-week velocity. Catches AI billboard effect with zero GA4 attribution."},
                  {l:"Branded search impression share",v:"Baseline M1",t:"Market awareness signal",c:C.green,note:"Share of 'Flo', 'Flo app', 'Flo period tracker' queries."},
                  {l:"Non-branded impressions (GSC)",v:"Baseline M1",t:"E->B health indicator",c:C.amber,note:"Rising impressions on 'perimenopause app', 'PCOS tracker' = E→B improving."},
                ].map((k,i)=>(
                  <div key={i} style={{background:C.faint,borderRadius:"7px",padding:"10px 12px"}}>
                    <div style={{fontSize:"10px",color:C.muted,marginBottom:"4px",lineHeight:1.4}}>{k.l}</div>
                    <div style={{fontFamily:"'JetBrains Mono',monospace",fontSize:"14px",color:k.c,marginBottom:"3px"}}>{k.v}</div>
                    <div style={{fontSize:"10px",color:k.c,marginBottom:"4px"}}>{k.t}</div>
                    <div style={{fontSize:"10px",color:C.faint,lineHeight:1.4}}>{k.note}</div>
                  </div>
                ))}
              </div>
            </div>

            {/* Layer 3 - Business Outcomes */}
            <div style={{background:C.amberDim,border:"1px solid "+C.amber+"30",borderRadius:"9px",padding:"14px 16px"}}>
              <div style={{fontSize:"11px",fontWeight:700,color:C.amber,letterSpacing:"0.08em",textTransform:"uppercase",marginBottom:"10px"}}>Layer 3 - Business Outcomes</div>
              <div style={{display:"grid",gridTemplateColumns:"repeat(2,1fr)",gap:"8px"}}>
                {[
                  {l:"AI referral sessions + conversion rate",t:"GA4 · baseline M1",note:"Direct but incomplete — ChatGPT + Perplexity don't always pass referrers cleanly"},
                  {l:"AI-attributed acquisition",t:"GA4 primary · in-app survey secondary",note:"In-app 'How did you hear?' with AI as explicit option closes the attribution gap"},
                  {l:"Install funnel from AI-cited prompts",t:"E->B prompts → App Store",note:"Track download velocity after hub page publication — perimenopause, PCOS, endo"},
                  {l:"Action-to-metric tie-back",t:"Monthly Action Log",note:"Which content published or pitched → which canary query metrics moved next month"},
                ].map((k,i)=>(
                  <div key={i} style={{padding:"10px 12px",background:C.faint,borderRadius:"7px"}}>
                    <div style={{fontSize:"12px",fontWeight:600,color:C.text,marginBottom:"3px"}}>{k.l.replace("E->B","E→B")}</div>
                    <div style={{fontSize:"10px",color:C.amber,marginBottom:"4px"}}>{k.t}</div>
                    <div style={{fontSize:"11px",color:C.muted,lineHeight:1.45}}>{k.note}</div>
                  </div>
                ))}
              </div>
            </div>

            <div style={{marginTop:"10px",padding:"10px 14px",background:C.faint,borderRadius:"7px",fontSize:"11px",color:C.muted,lineHeight:1.6}}>
              <strong style={{color:C.lav}}>Measurement discipline (Schulte 2026): </strong>Current baseline N=1 per prompt — false precision on all Layer 1 metrics. Run 5 volatile prompts (P04, P05, P10, P11, P13) x ChatGPT N=5 each = 25 runs, ~45 min, moves to MED CONFIDENCE. Baseline Claude M1 — most urgent gap (18.5% referral share, unbaselised).
            </div>
          </Card>
          <Card>
            <Lbl>Research Anchors</Lbl>
            <div style={{display:"flex",flexDirection:"column",gap:"5px"}}>
              {[["Muck Rack 2025","1M+ citations - 85% earned, 2% PR to AI overlap","Jul + Dec 2025"],["AirOps 2025","85% mentions from third-party; mention+citation = 40% repeat likelihood","2025"],["Schulte et al. 2026","Do Not Measure Once - N=10, bootstrap CIs","arxiv:2604.07585"],["Sielinski 2026","Quantifying uncertainty - hallucination exclusion","arxiv:2603.08924"],["canaifind.com v0.1","Static scan - crawlers, schema, headers, entity","2026-05-27"],["Profound 680M citations","11% ChatGPT + Perplexity overlap","2026"]].map(([a,t,r],i)=>(
                <div key={i} style={{display:"flex",gap:"10px",padding:"8px 11px",background:C.surfaceAlt,borderRadius:"6px"}}>
                  <span style={{fontFamily:"'JetBrains Mono',monospace",fontSize:"10px",color:C.accent,flexShrink:0,minWidth:"130px",marginTop:"1px"}}>{a}</span>
                  <div style={{flex:1,fontSize:"11px",color:C.muted}}>{t}</div>
                  <span style={{fontSize:"10px",color:C.faint,flexShrink:0}}>{r}</span>
                </div>
              ))}
            </div>
            <div style={{marginTop:"10px",padding:"10px",background:C.faint,borderRadius:"7px",fontSize:"11px",color:C.muted}}>
              Three Research Pillars: <strong style={{color:C.accent}}>Eijkemans (shadow reputation / canary queries / B→E + E→B)</strong> · <strong style={{color:C.lav}}>Jessier (AI Brand Drift matrix / 6 drift types)</strong> · <strong style={{color:C.green}}>Schulte 2026 (N=10, bootstrap CIs)</strong>
            </div>
            <div style={{marginTop:"10px",padding:"10px",background:C.faint,borderRadius:"7px",fontSize:"11px",color:C.muted}}>
              Pipeline: <strong style={{color:C.accent}}>github.com/ValentinaDorefice/geo-content-pipeline</strong> - 7.90/10 citation potential - $5.56 total
            </div>
          </Card>
        </div>
      )}

      <div style={{marginTop:"40px",paddingTop:"16px",borderTop:"1px solid "+C.border,display:"flex",justifyContent:"space-between",alignItems:"center"}}>
        <span style={{fontFamily:"'JetBrains Mono',monospace",fontSize:"10px",color:C.faint}}>v9.0 - Shadow Reputation framework - B→E/E→B taxonomy - Brand Drift types - Three research pillars</span>
        <span style={{fontSize:"11px",color:C.faint}}>Next: Claude + Perplexity + Gemini baselines - Jun 2026</span>
      </div>
    </div>
  );
}
